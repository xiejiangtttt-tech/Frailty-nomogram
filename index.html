<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慢性心力衰竭患者社会衰弱风险预测模型</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box; 
        }
        .range-hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background-color: #ecf0f1;
            border-radius: 8px;
            display: none; 
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .result-value {
            font-weight: bold;
            color: #e74c3c;
            font-size: 24px;
        }
        .bar-container {
            width: 100%;
            background-color: #ddd;
            border-radius: 10px;
            height: 20px;
            margin-top: 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
            transition: width 1s ease-in-out;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>慢性心力衰竭患者社会衰弱风险预测工具</h2>
    
    <div class="form-group">
        <label for="edema">1. 是否水肿 (Edema)</label>
        <select id="edema">
            <option value="0">否 (No)</option>
            <option value="1">是 (Yes)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="socialSupport">2. 社会支持总分 (SSRS Total Score)</label>
        <input type="number" id="socialSupport" placeholder="请输入分数 (10-50)" min="10" max="60">
        <div class="range-hint">系数：-0.1072 (分数越高，风险越低)</div>
    </div>

    <div class="form-group">
        <label for="pms">3. 个人掌控感量表 (PMS Score)</label>
        <input type="number" id="pms" placeholder="请输入分数 (10-36)" min="5" max="40">
        <div class="range-hint">系数：-0.2331 (分数越高，风险越低)</div>
    </div>

    <div class="form-group">
        <label for="age">4. 年龄分组 (Age Group)</label>
        <select id="age">
            <option value="0">< 45 岁 (参照组)</option>
            <option value="1">45 - 59 岁</option>
            <option value="2">60 - 69 岁</option>
            <option value="3">≥ 70 岁</option>
        </select>
    </div>

    <div class="form-group">
        <label for="liveAlone">5. 居住情况 (Living Status)</label>
        <select id="liveAlone">
            <option value="0">独居 (Living Alone)</option>
            <option value="1">非独居 (Not Living Alone)</option>
        </select>
        <div class="range-hint">注：非独居是保护因素，有助于降低风险。</div>
    </div>

    <button onclick="calculateRisk()">计算风险 (Calculate)</button>

    <div id="result">
        <div class="result-item">总积分 (Total Points): <span id="totalPoints" class="result-value">0</span></div>
        <div class="result-item">社会衰弱发生概率 (Predicted Risk): <span id="riskProb" class="result-value">0%</span></div>
        
        <div class="bar-container">
            <div id="riskBar" class="bar-fill"></div>
        </div>
        <p style="font-size: 14px; margin-top:10px;">*风险越高，进度条越红</p>
    </div>

    <div class="footer">
        Based on Logistic Regression Model<br>Intercept: 6.9547
    </div>
</div>

<script>
    function calculateRisk() {
        // --- 1. 获取用户输入 ---
        let edema = parseInt(document.getElementById('edema').value);
        let ss = parseFloat(document.getElementById('socialSupport').value);
        let pms = parseFloat(document.getElementById('pms').value);
        let ageGroup = parseInt(document.getElementById('age').value);
        let liveAlone = parseInt(document.getElementById('liveAlone').value);

        // --- 2. 简单的验证 ---
        if (isNaN(ss) || isNaN(pms)) {
            alert("请填写完整的社会支持分数和PMS分数");
            return;
        }

        // --- 3. 精确计算逻辑 (Logistic Regression) ---
        // LP = Intercept + β1*X1 + β2*X2 ...
        // 截距
        let lp = 6.9547;

        // 水肿
        if (edema === 1) lp += 0.9288;

        // 社会支持 (连续变量)
        lp += (ss * -0.1072);

        // 个人掌控感 (连续变量)
        lp += (pms * -0.2331);

        // 年龄分组
        if (ageGroup === 0) lp += 0;       // <45
        else if (ageGroup === 1) lp += 0.9837;  // 45-59
        else if (ageGroup === 2) lp += 1.7447;  // 60-69
        else if (ageGroup === 3) lp += 1.9256;  // ≥70

        // 居住情况: 1=非独居 (系数 -1.5912)
        if (liveAlone === 1) lp += -1.5912;

        // --- 4. 计算概率 ---
        let risk = 1 / (1 + Math.exp(-lp));

        // --- 5. 计算总积分 (转换显示) ---
        // 为了让“总积分”看起来和您第一张图的列线图刻度一致 (0-240分范围)，
        // 我们利用线性关系将 LP 转换为 Points。
        // 公式依据：Risk 50%(LP=0) ≈ 153分; Risk 10%(LP=-2.2) ≈ 110分。
        let displayPoints = (lp * 19.5) + 153; 

        // --- 6. 更新界面 ---
        document.getElementById('result').style.display = 'block';
        
        // 显示总积分 (取整)
        document.getElementById('totalPoints').innerText = Math.round(displayPoints);
        
        // 显示概率
        let riskPercent = (risk * 100).toFixed(1);
        document.getElementById('riskProb').innerText = riskPercent + "%";
        
        // 进度条
        let barWidth = riskPercent;
        if(barWidth > 100) barWidth = 100;
        document.getElementById('riskBar').style.width = barWidth + "%";

        // 颜色逻辑
        let bar = document.getElementById('riskBar');
        if (risk < 0.3) {
            bar.style.background = "linear-gradient(90deg, #2ecc71, #27ae60)";
        } else if (risk < 0.7) {
            bar.style.background = "linear-gradient(90deg, #f1c40f, #e67e22)";
        } else {
            bar.style.background = "linear-gradient(90deg, #e74c3c, #c0392b)";
        }
    }
</script>

</body>
</html>
